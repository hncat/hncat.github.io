<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- 节点渐变 -->
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="nodeGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- 箭头标记 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1100" height="950" fill="url(#bgGrad)"/>

  <!-- 标题 -->
  <text x="550" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold" font-family="Consolas, monospace">lock_free_stack 节点回收机制 (try_reclaim)</text>

  <!-- ======== 上方: 主栈结构 ======== -->
  <text x="550" y="80" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Consolas, monospace">主栈 (head →)</text>

  <!-- 主栈节点 -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="13" font-family="Consolas, monospace">Node A (head)</text>
    <text x="60" y="40" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Consolas, monospace">data: T</text>
    <line x1="120" y1="25" x2="170" y2="25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="13" font-family="Consolas, monospace">Node B</text>
    <text x="60" y="40" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Consolas, monospace">data: T</text>
    <line x1="120" y1="25" x2="170" y2="25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="13" font-family="Consolas, monospace">Node C</text>
    <text x="60" y="40" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Consolas, monospace">data: T</text>
    <line x1="120" y1="25" x2="170" y2="25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(690, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="13" font-family="Consolas, monospace">Node D</text>
    <text x="60" y="40" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Consolas, monospace">data: T</text>
    <line x1="120" y1="25" x2="170" y2="25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(870, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#nodeGrad5)" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="13" font-family="Consolas, monospace">Node E</text>
    <text x="60" y="40" text-anchor="middle" fill="#ddd6fe" font-size="11" font-family="Consolas, monospace">data: T</text>
    <text x="60" y="62" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="Consolas, monospace">nullptr</text>
  </g>

  <!-- ======== 场景分割线 ======== -->
  <line x1="50" y1="180" x2="1050" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ======== 场景1: threads_in_pop == 1 ======== -->
  <text x="550" y="210" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold" font-family="Consolas, monospace">场景 1: threads_in_pop == 1 (仅当前线程在 pop)</text>

  <!-- 计数器 -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold" font-family="Consolas, monospace">threads_in_pop = 1</text>
  </g>

  <!-- 当前线程标识 -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="23" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold" font-family="Consolas, monospace">Thread T1 (pop)</text>
  </g>

  <!-- 步骤标注 -->
  <g transform="translate(300, 240)">
    <rect x="0" y="0" width="700" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">① if (threads_in_pop == 1)  →  条件成立，进入安全回收路径</text>
    <text x="20" y="55" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">② node* nodes_to_delete = to_be_deleted.exchange(nullptr);</text>
    <text x="20" y="82" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">③ if (!--threads_in_pop)  →  减1后变为0，确认无其他线程</text>
    <text x="20" y="109" fill="#34d399" font-size="13" font-weight="bold" font-family="Consolas, monospace">④ delete_nodes(nodes_to_delete);  →  安全删除所有待回收节点</text>
  </g>

  <!-- to_be_deleted 链表 (场景1) -->
  <text x="550" y="400" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Consolas, monospace">to_be_deleted 链表 (exchange 前)</text>

  <g transform="translate(250, 420)">
    <rect x="0" y="0" width="100" height="45" rx="6" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Consolas, monospace">Node X</text>
    <text x="50" y="36" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Consolas, monospace">待删除</text>
    <line x1="100" y1="22" x2="140" y2="22" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(400, 420)">
    <rect x="0" y="0" width="100" height="45" rx="6" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Consolas, monospace">Node Y</text>
    <text x="50" y="36" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Consolas, monospace">待删除</text>
    <line x1="100" y1="22" x2="140" y2="22" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(550, 420)">
    <rect x="0" y="0" width="100" height="45" rx="6" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Consolas, monospace">Node Z</text>
    <text x="50" y="36" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Consolas, monospace">待删除</text>
    <text x="50" y="62" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="Consolas, monospace">nullptr</text>
  </g>

  <!-- exchange 操作示意 -->
  <g transform="translate(700, 420)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="90" y="20" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="Consolas, monospace">exchange(nullptr)</text>
    <text x="90" y="38" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="Consolas, monospace">原子取走链表</text>
  </g>

  <!-- 回收结果 -->
  <g transform="translate(920, 420)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#34d399" font-size="12" font-family="Consolas, monospace">✓ 安全</text>
    <text x="50" y="38" text-anchor="middle" fill="#34d399" font-size="11" font-family="Consolas, monospace">全部 delete</text>
  </g>

  <!-- 旧头节点删除 -->
  <g transform="translate(250, 500)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-family="Consolas, monospace">⑦ delete old_head;</text>
  </g>
  <g transform="translate(250, 520)">
    <rect x="0" y="0" width="100" height="45" rx="6" fill="url(#nodeGrad4)" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Consolas, monospace">old_head</text>
    <text x="50" y="36" text-anchor="middle" fill="#fecaca" font-size="10" font-family="Consolas, monospace">刚pop出的节点</text>
    <line x1="110" y1="22" x2="180" y2="22" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="200" y="26" fill="#ef4444" font-size="13" font-family="Consolas, monospace">直接删除（安全）</text>
  </g>

  <!-- ======== 场景分割线 ======== -->
  <line x1="50" y1="590" x2="1050" y2="590" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ======== 场景2: threads_in_pop != 1 ======== -->
  <text x="550" y="620" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="bold" font-family="Consolas, monospace">场景 2: threads_in_pop != 1 (多线程同时 pop)</text>

  <!-- 计数器 -->
  <g transform="translate(80, 650)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold" font-family="Consolas, monospace">threads_in_pop = 3</text>
  </g>

  <!-- 多个线程 -->
  <g transform="translate(80, 710)">
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="21" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold" font-family="Consolas, monospace">Thread T1 (pop)</text>
  </g>
  <g transform="translate(80, 750)">
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="21" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold" font-family="Consolas, monospace">Thread T2 (pop)</text>
  </g>
  <g transform="translate(80, 790)">
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="21" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold" font-family="Consolas, monospace">Thread T3 (pop)</text>
  </g>

  <!-- 步骤标注 -->
  <g transform="translate(300, 650)">
    <rect x="0" y="0" width="700" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">① if (threads_in_pop == 1)  →  条件不成立，进入 else 分支</text>
    <text x="20" y="55" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">⑧ chain_pending_node(old_head);  →  将旧头节点挂到 to_be_deleted</text>
    <text x="20" y="82" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">   --threads_in_pop;  →  当前线程退出 pop，计数减1</text>
    <text x="20" y="115" fill="#f87171" font-size="13" font-weight="bold" font-family="Consolas, monospace">⚠ 此时不能删除任何节点，因为其他线程可能仍在访问链表！</text>
  </g>

  <!-- to_be_deleted 链表 (场景2) -->
  <text x="550" y="830" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Consolas, monospace">to_be_deleted 链表 (不断累积)</text>

  <g transform="translate(200, 850)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
    <text x="45" y="18" text-anchor="middle" fill="white" font-size="11" font-family="Consolas, monospace">Node P</text>
    <text x="45" y="32" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Consolas, monospace">旧待删</text>
    <line x1="90" y1="20" x2="120" y2="20" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(330, 850)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
    <text x="45" y="18" text-anchor="middle" fill="white" font-size="11" font-family="Consolas, monospace">Node Q</text>
    <text x="45" y="32" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Consolas, monospace">旧待删</text>
    <line x1="90" y1="20" x2="120" y2="20" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(460, 850)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="url(#nodeGrad4)" filter="url(#shadow)"/>
    <text x="45" y="18" text-anchor="middle" fill="white" font-size="11" font-family="Consolas, monospace">old_head</text>
    <text x="45" y="32" text-anchor="middle" fill="#fecaca" font-size="9" font-family="Consolas, monospace">T1加入</text>
    <line x1="90" y1="20" x2="120" y2="20" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>

  <g transform="translate(590, 850)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="url(#nodeGrad4)" filter="url(#shadow)"/>
    <text x="45" y="18" text-anchor="middle" fill="white" font-size="11" font-family="Consolas, monospace">old_head</text>
    <text x="45" y="32" text-anchor="middle" fill="#fecaca" font-size="9" font-family="Consolas, monospace">T2加入</text>
    <line x1="90" y1="20" x2="120" y2="20" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>

  <g transform="translate(720, 850)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="url(#nodeGrad4)" filter="url(#shadow)"/>
    <text x="45" y="18" text-anchor="middle" fill="white" font-size="11" font-family="Consolas, monospace">old_head</text>
    <text x="45" y="32" text-anchor="middle" fill="#fecaca" font-size="9" font-family="Consolas, monospace">T3加入</text>
    <text x="45" y="56" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="Consolas, monospace">nullptr</text>
  </g>

  <g transform="translate(840, 850)">
    <rect x="0" y="0" width="140" height="45" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="70" y="18" text-anchor="middle" fill="#f87171" font-size="12" font-family="Consolas, monospace">等待安全时机</text>
    <text x="70" y="36" text-anchor="middle" fill="#f87171" font-size="11" font-family="Consolas, monospace">(threads_in_pop→1)</text>
  </g>

  <!-- 底部说明 -->
  <text x="550" y="930" text-anchor="middle" fill="#64748b" font-size="12" font-family="Consolas, monospace">
    核心思想：仅当 threads_in_pop == 1 时，说明没有其他线程访问链表，此时可以安全回收节点；否则将节点挂入 to_be_deleted 等待链表，由最后一个退出的线程统一清理。
  </text>
</svg>