<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5f1e3a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5f1e3a;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a5f1e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3a5f1e;stop-opacity:0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L2,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowHeadDashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L2,6 Z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <rect width="1000" height="750" fill="#0d1117"/>

  <!-- 标题 -->
  <text x="500" y="40" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="22" font-weight="600" fill="#e6edf3">释放序列 (Release Sequence) 执行图</text>
  <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#8b949e">为什么 fetch_sub() 不需要 release 语义？</text>

  <!-- 三栏背景 -->
  <rect x="50" y="100" width="280" height="520" rx="4" fill="url(#col1Grad)" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="100" width="280" height="520" rx="4" fill="url(#col2Grad)" stroke="#30363d" stroke-width="1"/>
  <rect x="670" y="100" width="280" height="520" rx="4" fill="url(#col3Grad)" stroke="#30363d" stroke-width="1"/>

  <!-- 栏目标题 -->
  <text x="190" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="15" font-weight="600" fill="#58a6ff">生产者线程 (Thread A)</text>
  <text x="190" y="155" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#8b949e">populate_queue()</text>

  <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="15" font-weight="600" fill="#f778ba">消费者线程 B</text>
  <text x="500" y="155" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#8b949e">consume_queue_items()</text>

  <text x="810" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="15" font-weight="600" fill="#7ee787">消费者线程 C</text>
  <text x="810" y="155" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#8b949e">consume_queue_items()</text>

  <!-- 操作框 - 重新布局 -->
  <!-- 生产者：写入数据 -->
  <rect x="90" y="190" width="200" height="70" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="190" y="220" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#e6edf3">写入队列数据</text>
  <text x="190" y="245" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#8b949e">queue_data.push_back()</text>

  <!-- 生产者：release store - 放在左侧 -->
  <rect x="90" y="320" width="200" height="80" rx="6" fill="#21262d" stroke="#f0883e" stroke-width="3" filter="url(#glow)"/>
  <text x="190" y="345" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#f0883e" font-weight="bold">count.store(20)</text>
  <text x="190" y="370" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#f0883e" font-weight="600">memory_order_release</text>
  <text x="190" y="390" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">释放序列起点</text>

  <!-- 消费者B：acquire fetch_sub - 与store同高度 -->
  <rect x="400" y="320" width="200" height="80" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="3" filter="url(#glow)"/>
  <text x="500" y="345" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#58a6ff" font-weight="bold">count.fetch_sub(1)</text>
  <text x="500" y="370" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#58a6ff" font-weight="600">memory_order_acquire</text>
  <text x="500" y="390" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">读到值: 20 → 19</text>

  <!-- 消费者C：acquire fetch_sub - 放在上方，避免与B的读取框重叠 -->
  <rect x="710" y="250" width="200" height="80" rx="6" fill="#21262d" stroke="#f778ba" stroke-width="3" filter="url(#glow)"/>
  <text x="810" y="275" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#f778ba" font-weight="bold">count.fetch_sub(1)</text>
  <text x="810" y="300" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#f778ba" font-weight="600">memory_order_acquire</text>
  <text x="810" y="320" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">读到值: 19 → 18</text>

  <!-- 消费者B：安全读取 - 放在最下方 -->
  <rect x="400" y="460" width="200" height="70" rx="6" fill="#238636" stroke="#3fb950" stroke-width="2" opacity="0.15"/>
  <text x="500" y="490" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#3fb950" font-weight="600">✓ 安全读取数据</text>
  <text x="500" y="515" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#7ee787">process(queue_data[19])</text>

  <!-- 消费者C：安全读取 - 放在最下方 -->
  <rect x="710" y="460" width="200" height="70" rx="6" fill="#238636" stroke="#3fb950" stroke-width="2" opacity="0.15"/>
  <text x="810" y="490" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#3fb950" font-weight="600">✓ 安全读取数据</text>
  <text x="810" y="515" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#7ee787">process(queue_data[18])</text>

  <!-- 内部流程箭头 -->
  <path d="M190 260 L190 320" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M500 400 L500 460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M810 330 L810 460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- 同步箭头：store -> fetch_sub (B) - 水平直线 -->
  <path d="M290 360 L400 360" stroke="#00d4ff" stroke-width="3" fill="none" marker-end="url(#arrowHead)"/>
  <text x="345" y="350" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#00d4ff" font-weight="600">同步</text>

  <!-- 同步箭头：store -> fetch_sub (C) - 从上方走，避开所有框 -->
  <path d="M290 340 Q500 220 710 290" stroke="#00d4ff" stroke-width="3" fill="none" marker-end="url(#arrowHead)"/>
  <text x="500" y="260" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#00d4ff" font-weight="600">同步</text>

  <!-- 释放序列链：fetch_sub(B) -> fetch_sub(C) - 从上方走 -->
  <path d="M600 340 Q650 290 710 330" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowHeadDashed)"/>
  <text x="655" y="325" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#ff6b6b">释放序列链</text>

  <!-- 底部解释区域 -->
  <rect x="50" y="640" width="450" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="665" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#f0883e" font-weight="600">释放序列规则</text>
  <text x="60" y="690" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    1. 序列头(head)：必须是 release/acq_rel/seq_cst 存储操作
  </text>
  <text x="60" y="710" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    2. 后续 RMW 操作：自动成为序列的一部分
  </text>
  <text x="60" y="730" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    3. 即使使用 relaxed，也能与序列头同步
  </text>

  <rect x="520" y="640" width="430" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="665" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#58a6ff" font-weight="600">核心答案：为什么不需要 release？</text>
  <text x="530" y="690" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 线程 C 的 acquire-load 读到线程 B RMW 写入的值
  </text>
  <text x="530" y="710" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 该 RMW 是释放序列的一部分，自动与线程 A 的 store 同步
  </text>
  <text x="530" y="730" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 无需 release：消费者线程之间不需要相互同步
  </text>

</svg>