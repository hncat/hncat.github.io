<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780">
  <defs>
    <!-- Gradients -->
    <linearGradient id="thread1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thread2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="guaranteedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="notGuaranteedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#357abd"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#e67e22"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#229954"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#7f8c8d"/>
    </marker>
    <marker id="arrowDashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#7f8c8d"/>
    </marker>

    <!-- Filter for shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="780" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="24" font-weight="bold" fill="#ecf0f1">C++ Memory Order 执行图</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="14" fill="#bdc3c7">Release-Consume 语义与 Happens-Before 关系</text>

  <!-- Thread Labels -->
  <rect x="80" y="85" width="300" height="40" rx="8" fill="url(#thread1Grad)" filter="url(#shadow)"/>
  <text x="230" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="white">Thread 1 (create_x)</text>

  <rect x="520" y="85" width="300" height="40" rx="8" fill="url(#thread2Grad)" filter="url(#shadow)"/>
  <text x="670" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="white">Thread 2 (use_x)</text>

  <!-- Thread 1 Operations -->
  <rect x="80" y="145" width="300" height="70" rx="8" fill="#2c3e50" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="170" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="#e74c3c" font-weight="bold">① a.store(99, relaxed)</text>
  <text x="230" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#ecf0f1">memory_order_relaxed</text>
  <text x="230" y="205" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#95a5a6">无同步保证</text>

  <rect x="80" y="235" width="300" height="70" rx="8" fill="#2c3e50" stroke="#f39c12" stroke-width="3" filter="url(#shadow)"/>
  <text x="230" y="260" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="#f39c12" font-weight="bold">② p.store(x, release)</text>
  <text x="230" y="280" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#ecf0f1">memory_order_release</text>
  <text x="230" y="295" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#f39c12">发布语义：同步点</text>

  <!-- Thread 2 Operations -->
  <rect x="520" y="235" width="300" height="70" rx="8" fill="#2c3e50" stroke="#f39c12" stroke-width="3" filter="url(#shadow)"/>
  <text x="670" y="260" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="#f39c12" font-weight="bold">③ p.load(consume)</text>
  <text x="670" y="280" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#ecf0f1">memory_order_consume</text>
  <text x="670" y="295" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#f39c12">消费语义：获取依赖</text>

  <rect x="520" y="325" width="300" height="60" rx="8" fill="url(#guaranteedGrad)" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="350" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="white" font-weight="bold">④ assert(x->i == 42)</text>
  <text x="670" y="370" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#d5f5e3">✓ 保证成立 (依赖携带)</text>

  <rect x="520" y="405" width="300" height="60" rx="8" fill="url(#guaranteedGrad)" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="430" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="white" font-weight="bold">⑤ assert(x->s == "hello")</text>
  <text x="670" y="450" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#d5f5e3">✓ 保证成立 (依赖携带)</text>

  <rect x="520" y="485" width="300" height="60" rx="8" fill="url(#notGuaranteedGrad)" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="510" text-anchor="middle" font-family="'Consolas', 'Monaco', monospace" 
        font-size="13" fill="white" font-weight="bold">⑥ assert(a.load() == 99)</text>
  <text x="670" y="530" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="11" fill="#ecf0f1">✗ 不保证 (无依赖关系)</text>

  <!-- Memory Objects -->
  <rect x="80" y="575" width="140" height="80" rx="8" fill="url(#memoryGrad)" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="600" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="14" fill="white" font-weight="bold">std::atomic&lt;int&gt; a</text>
  <text x="150" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="12" fill="#e8daef">值: 99</text>
  <text x="150" y="640" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#d2b4de">独立原子变量</text>

  <rect x="380" y="575" width="140" height="80" rx="8" fill="url(#memoryGrad)" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="600" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="14" fill="white" font-weight="bold">std::atomic&lt;X*&gt; p</text>
  <text x="450" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="12" fill="#e8daef">指向 X 的指针</text>
  <text x="450" y="640" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#d2b4de">同步枢纽</text>

  <rect x="680" y="575" width="140" height="80" rx="8" fill="#34495e" stroke="#16a085" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="600" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="14" fill="white" font-weight="bold">struct X</text>
  <text x="750" y="620" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#a3e4d7">i = 42</text>
  <text x="750" y="637" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="11" fill="#a3e4d7">s = "hello"</text>

  <!-- Arrows -->
  <path d="M230 215 L230 235" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="245" y="230" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4a90d9">sequenced-before</text>

  <path d="M670 305 L670 325" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M670 385 L670 405" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M670 465 L670 485" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowGray)"/>

  <path d="M380 270 Q450 270 520 270" stroke="#f39c12" stroke-width="4" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="450" y="260" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="12" fill="#f39c12" font-weight="bold">synchronizes-with</text>
  <text x="450" y="290" text-anchor="middle" font-family="'Segoe UI', sans-serif" 
        font-size="10" fill="#f5cba7">Release-Consume 配对</text>

  <path d="M670 305 Q600 345 600 355" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="585" y="335" font-family="'Segoe UI', sans-serif" font-size="9" fill="#27ae60">dependency</text>

  <path d="M670 305 Q600 425 600 435" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="585" y="405" font-family="'Segoe UI', sans-serif" font-size="9" fill="#27ae60">dependency</text>

  <path d="M150 575 Q150 515 520 515" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowDashed)"/>
  <text x="320" y="565" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7f8c8d">无依赖关系</text>

  <path d="M230 305 Q350 445 520 355" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="350" y="375" font-family="'Segoe UI', sans-serif" font-size="10" fill="#27ae60">happens-before ✓</text>

  <path d="M230 305 Q350 555 520 435" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="350" y="455" font-family="'Segoe UI', sans-serif" font-size="10" fill="#27ae60">happens-before ✓</text>

  <path d="M230 180 Q100 345 520 515" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowDashed)"/>
  <text x="280" y="415" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7f8c8d">无 happens-before ✗</text>

  <!-- Legend Box - Redesigned with better layout -->
  <rect x="20" y="685" width="410" height="85" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="1" opacity="0.95" filter="url(#shadow)"/>
  <text x="30" y="710" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ecf0f1" font-weight="bold">图例说明</text>

  <!-- Row 1 of legend -->
  <line x1="30" y1="728" x2="55" y2="728" stroke="#f39c12" stroke-width="3"/>
  <text x="65" y="733" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecf0f1">synchronizes-with</text>

  <line x1="200" y1="728" x2="225" y2="728" stroke="#27ae60" stroke-width="2"/>
  <text x="235" y="733" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecf0f1">happens-before (保证)</text>

  <!-- Row 2 of legend -->
  <line x1="30" y1="753" x2="55" y2="753" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="65" y="758" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecf0f1">无保证 (可能失败)</text>

  <line x1="200" y1="753" x2="225" y2="753" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="235" y="758" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecf0f1">carries-dependency</text>

  <!-- Key insight box -->
  <rect x="450" y="685" width="430" height="85" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>
  <text x="460" y="710" font-family="'Segoe UI', sans-serif" font-size="14" fill="#bfdbfe" font-weight="bold">关键洞察</text>
  <text x="460" y="735" font-family="'Segoe UI', sans-serif" font-size="11" fill="#dbeafe">Release-Consume 仅建立对指针解引用操作的 happens-before。</text>
  <text x="460" y="755" font-family="'Segoe UI', sans-serif" font-size="11" fill="#dbeafe">由于 ① 不依赖于 ③，⑥ 可能失败（data race）。如需保证 ⑥，应将 ③ 改为 acquire。</text>

</svg>