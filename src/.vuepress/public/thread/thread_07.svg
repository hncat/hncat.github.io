<svg viewBox="0 0 1000 700" width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="as" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ecca3"/>
    </marker>
  </defs>
  
  <rect width="1000" height="800" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#fff" font-family="monospace" font-size="17" font-weight="bold">
    acquire/release：assert(z != 0) 可能触发！
  </text>
  <text x="500" y="55" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12" font-weight="bold">
    无全局全序，x 和 y 的同步相互独立
  </text>
  
  <!-- Thread A - 修正位置 -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="url(#t1)" stroke="#4ecca3" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12" font-weight="bold">Thread A</text>
    
    <rect x="10" y="40" width="180" height="50" rx="4" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="100" y="60" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">① x.store(true)</text>
    <text x="100" y="80" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10" font-weight="bold">release</text>
  </g>
  
  <!-- Thread B - 修正位置，放在右侧 -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="url(#t1)" stroke="#4ecca3" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12" font-weight="bold">Thread B</text>
    
    <rect x="10" y="40" width="180" height="50" rx="4" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="100" y="60" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">② y.store(true)</text>
    <text x="100" y="80" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10" font-weight="bold">release</text>
  </g>
  
  <!-- Thread C -->
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="url(#t1)" stroke="#ffd93d" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">Thread C</text>
    
    <rect x="10" y="40" width="180" height="40" rx="4" fill="#1a1a2e" stroke="#4ecca3" stroke-width="2"/>
    <text x="100" y="62" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="10">while(!x.load())</text>
    
    <rect x="10" y="90" width="180" height="50" rx="4" fill="#1a1a2e" stroke="#ffd93d" stroke-width="2"/>
    <text x="100" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">③ if(y.load()) z++</text>
    <text x="100" y="130" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="9" font-weight="bold">acquire</text>
    
    <line x1="100" y1="83" x2="100" y2="90" stroke="#4ecca3" stroke-width="2" marker-end="url(#as)"/>
  </g>
  
  <!-- Thread D -->
  <g transform="translate(760, 80)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="url(#t1)" stroke="#ffd93d" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">Thread D</text>
    
    <rect x="10" y="40" width="180" height="40" rx="4" fill="#1a1a2e" stroke="#4ecca3" stroke-width="2"/>
    <text x="100" y="62" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="10">while(!y.load())</text>
    
    <rect x="10" y="90" width="180" height="50" rx="4" fill="#1a1a2e" stroke="#ffd93d" stroke-width="2"/>
    <text x="100" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">④ if(x.load()) z++</text>
    <text x="100" y="130" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="9" font-weight="bold">acquire</text>
    
    <line x1="100" y1="83" x2="100" y2="90" stroke="#4ecca3" stroke-width="2" marker-end="url(#as)"/>
  </g>
  
  <!-- Sync pairs -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="450" height="100" rx="6" fill="#1a1a1e" stroke="#4ecca3" stroke-width="2"/>
    <text x="225" y="22" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12" font-weight="bold">同步对 1：x 的 release-acquire</text>
    <text x="20" y="50" fill="#fff" font-family="monospace" font-size="10">① x.store(release) —sw→ C 的 x.load(acquire)</text>
    <text x="20" y="72" fill="#4ecca3" font-family="monospace" font-size="10">保证：C 看到 x=true 时，① 之前的操作对 C 可见</text>
    <text x="20" y="92" fill="#e94560" font-family="monospace" font-size="10" font-weight="bold">但：对 y 的操作无任何保证！</text>
  </g>
  
  <g transform="translate(520, 200)">
    <rect x="0" y="0" width="440" height="100" rx="6" fill="#1a1a1e" stroke="#ffd93d" stroke-width="2"/>
    <text x="220" y="22" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">同步对 2：y 的 release-acquire</text>
    <text x="20" y="50" fill="#fff" font-family="monospace" font-size="10">② y.store(release) —sw→ D 的 y.load(acquire)</text>
    <text x="20" y="72" fill="#ffd93d" font-family="monospace" font-size="10">保证：D 看到 y=true 时，② 之前的操作对 D 可见</text>
    <text x="20" y="92" fill="#e94560" font-family="monospace" font-size="10" font-weight="bold">但：对 x 的操作无任何保证！</text>
  </g>
  
  <!-- Key problem -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="910" height="80" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="455" y="22" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">关键问题：两个同步对相互独立，无全局全序</text>
    <text x="20" y="48" fill="#aaa" font-family="monospace" font-size="10">• C 通过 x 同步知道 A 的操作，但不知道 B 对 y 的操作</text>
    <text x="20" y="68" fill="#aaa" font-family="monospace" font-size="10">• D 通过 y 同步知道 B 的操作，但不知道 A 对 x 的操作</text>
  </g>
  
  <!-- Assert trigger scenario -->
  <g transform="translate(50, 415)">
    <rect x="0" y="0" width="910" height="140" rx="6" fill="#1a1a1e" stroke="#e94560" stroke-width="2"/>
    <text x="455" y="22" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">导致 assert 触发的场景</text>
    <text x="20" y="48" fill="#ffd93d" font-family="monospace" font-size="11" font-weight="bold">场景：C 看到 x=true 但 y=false，D 看到 y=true 但 x=false</text>
    <text x="40" y="75" fill="#fff" font-family="monospace" font-size="10">• Thread C：x.load(acquire)=true（与 ① 同步），但 y.load(acquire)=false</text>
    <text x="40" y="95" fill="#aaa" font-family="monospace" font-size="9">→ C 知道 A 完成了 x.store，但 B 的 y.store 可能还未执行</text>
    <text x="40" y="118" fill="#fff" font-family="monospace" font-size="10">• Thread D：y.load(acquire)=true（与 ② 同步），但 x.load(acquire)=false</text>
    <text x="455" y="138" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="11" font-weight="bold">结果：z = 0，assert 触发！</text>
  </g>
  
  <!-- Comparison with seq_cst - 上移确保可见 -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="910" height="100" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="1"/>
    <text x="455" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">对比：memory_order_seq_cst 如何解决？</text>
    <text x="20" y="55" fill="#4ecca3" font-family="monospace" font-size="10">• seq_cst 要求全局全序，所有 release 操作之间有确定顺序</text>
    <text x="20" y="78" fill="#4ecca3" font-family="monospace" font-size="10">• 若 ① 在 ② 之前，则 C 看到 x=true 时，通过全序传递性，y=true 也必然可见</text>
    <text x="455" y="95" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="10" font-weight="bold">acquire/release 只保证配对同步，seq_cst 保证全局顺序</text>
  </g>
  
  <!-- Bottom spacer -->
  <text x="500" y="690" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="1">.</text>
</svg>