<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850">
  <defs>
    <linearGradient id="deleteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
    <linearGradient id="existingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#722ed1"/>
      <stop offset="100%" stop-color="#531dab"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52c41a"/>
      <stop offset="100%" stop-color="#389e0d"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4d4f"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52c41a"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fa8c16"/>
    </marker>
  </defs>
  
  <rect width="1000" height="850" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#262626">
    单线程链表头删法执行流程
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8c8c8c">
    五步完成：读取head → 读取next → 移动head → 返回data → 删除节点
  </text>
  
  <!-- ========== 步骤0：初始状态 ========== -->
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#262626">
    初始状态
  </text>
  <text x="50" y="132" font-family="Courier New, monospace" font-size="12" fill="#8c8c8c">
    // 已有链表：head → [A] → [B] → [C] → nullptr
  </text>
  
  <!-- head -->
  <rect x="80" y="155" width="70" height="36" rx="4" fill="#f5f5f5" stroke="#262626" stroke-width="2"/>
  <text x="115" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626">head</text>
  <line x1="150" y1="173" x2="210" y2="173" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- 节点A（将被删除） -->
  <rect x="210" y="150" width="100" height="56" rx="6" fill="url(#deleteGrad)" stroke="#cf1322" stroke-width="2"/>
  <text x="260" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 A</text>
  <text x="260" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  <line x1="310" y1="195" x2="370" y2="195" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- 节点B -->
  <rect x="370" y="150" width="100" height="56" rx="6" fill="url(#existingGrad)" stroke="#531dab" stroke-width="2"/>
  <text x="420" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 B</text>
  <text x="420" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  <line x1="470" y1="195" x2="530" y2="195" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- 节点C -->
  <rect x="530" y="150" width="100" height="56" rx="6" fill="url(#existingGrad)" stroke="#531dab" stroke-width="2"/>
  <text x="580" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 C</text>
  <text x="580" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  <line x1="630" y1="195" x2="690" y2="195" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="200" font-family="Arial, sans-serif" font-size="13" fill="#bfbfbf" font-style="italic">nullptr</text>
  
  <!-- ========== 步骤1：读取当前head指针的值 ========== -->
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cf1322">
    步骤1：读取当前head指针的值
  </text>
  <text x="50" y="302" font-family="Courier New, monospace" font-size="12" fill="#096dd9">
    node* old_head = head;  // old_head指向A
  </text>
  
  <!-- head -->
  <rect x="80" y="325" width="70" height="36" rx="4" fill="#f5f5f5" stroke="#262626" stroke-width="2"/>
  <text x="115" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626">head</text>
  <line x1="150" y1="343" x2="210" y2="343" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- 节点A -->
  <rect x="210" y="320" width="100" height="56" rx="6" fill="url(#deleteGrad)" stroke="#cf1322" stroke-width="2"/>
  <text x="260" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 A</text>
  <text x="260" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  
  <!-- old_head标签 -->
  <text x="320" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#cf1322">old_head</text>
  <line x1="310" y1="350" x2="320" y2="350" stroke="#cf1322" stroke-width="2" marker-end="url(#arrRed)"/>
  
  <!-- 省略B、C -->
  <line x1="310" y1="365" x2="340" y2="365" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="370" font-family="Arial, sans-serif" font-size="12" fill="#bfbfbf">...</text>
  
  <!-- ========== 步骤2：读取head->next ========== -->
  <text x="50" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cf1322">
    步骤2：读取head->next
  </text>
  <text x="50" y="452" font-family="Courier New, monospace" font-size="12" fill="#096dd9">
    node* new_head = old_head->next;  // new_head指向B
  </text>
  
  <!-- old_head指向A -->
  <rect x="80" y="475" width="100" height="56" rx="6" fill="url(#deleteGrad)" stroke="#cf1322" stroke-width="2" opacity="0.5"/>
  <text x="130" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">数据 A</text>
  <text x="130" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">next</text>
  <text x="50" y="505" font-family="Arial, sans-serif" font-size="11" fill="#cf1322">old_head</text>
  <line x1="70" y1="503" x2="80" y2="503" stroke="#cf1322" stroke-width="2" marker-end="url(#arrRed)"/>
  
  <!-- next指向B（橙色高亮） -->
  <line x1="180" y1="515" x2="240" y2="515" stroke="#fa8c16" stroke-width="3" marker-end="url(#arrOrange)"/>
  <text x="200" y="505" font-family="Arial, sans-serif" font-size="11" fill="#fa8c16">读取next</text>
  
  <!-- 节点B（新的头节点候选） -->
  <rect x="240" y="475" width="100" height="56" rx="6" fill="#d9f7be" stroke="#52c41a" stroke-width="2"/>
  <text x="290" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#135200">数据 B</text>
  <text x="290" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#135200">next</text>
  <text x="350" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52c41a">new_head</text>
  <line x1="340" y1="503" x2="350" y2="503" stroke="#52c41a" stroke-width="2" marker-end="url(#arrGreen)"/>
  
  <!-- 省略C -->
  <line x1="340" y1="520" x2="370" y2="520" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="525" font-family="Arial, sans-serif" font-size="12" fill="#bfbfbf">...</text>
  
  <!-- ========== 步骤3：设置head到head->next ========== -->
  <text x="50" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cf1322">
    步骤3：设置head到head->next
  </text>
  <text x="50" y="612" font-family="Courier New, monospace" font-size="12" fill="#096dd9">
    head = new_head;  // head现在指向B
  </text>
  
  <!-- 最终head（绿色） -->
  <rect x="80" y="635" width="70" height="36" rx="4" fill="#d9f7be" stroke="#52c41a" stroke-width="2"/>
  <text x="115" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#135200">head</text>
  <line x1="150" y1="653" x2="210" y2="653" stroke="#52c41a" stroke-width="3" marker-end="url(#arrGreen)"/>
  
  <!-- 节点B（成为新头） -->
  <rect x="210" y="630" width="100" height="56" rx="6" fill="url(#resultGrad)" stroke="#389e0d" stroke-width="2"/>
  <text x="260" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 B</text>
  <text x="260" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  <line x1="310" y1="675" x2="370" y2="675" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- 节点C -->
  <rect x="370" y="630" width="100" height="56" rx="6" fill="url(#existingGrad)" stroke="#531dab" stroke-width="2"/>
  <text x="420" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">数据 C</text>
  <text x="420" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">next</text>
  <line x1="470" y1="675" x2="530" y2="675" stroke="#262626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="680" font-family="Arial, sans-serif" font-size="13" fill="#bfbfbf" font-style="italic">nullptr</text>
  
  <!-- 被删除的A（虚线框，表示已脱离链表） -->
  <rect x="600" y="630" width="100" height="56" rx="6" fill="none" stroke="#ff4d4f" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="650" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#cf1322">数据 A</text>
  <text x="650" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cf1322">next</text>
  <text x="650" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cf1322" font-style="italic">待删除</text>
  
  <!-- 步骤4和5文字说明 -->
  <text x="50" y="750" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#389e0d">
    步骤4：通过索引node，返回data数据
  </text>
  <text x="50" y="772" font-family="Courier New, monospace" font-size="12" fill="#096dd9">
    T result = old_head->data;  // 保存A的数据
  </text>
  
  <text x="50" y="800" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#389e0d">
    步骤5：删除索引节点
  </text>
  <text x="50" y="822" font-family="Courier New, monospace" font-size="12" fill="#096dd9">
    delete old_head;  // 释放A的内存
  </text>
  
  <!-- 右侧说明框 -->
  <rect x="720" y="280" width="250" height="200" rx="8" fill="#f6ffed" stroke="#b7eb8f" stroke-width="1"/>
  <text x="735" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#135200">
    单线程删除特点
  </text>
  <text x="735" y="330" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 无竞争条件
  </text>
  <text x="735" y="352" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 无需原子操作
  </text>
  <text x="735" y="374" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 直接修改head指针
  </text>
  <text x="735" y="396" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 先保存next再移head
  </text>
  <text x="735" y="418" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 最后释放内存
  </text>
  <text x="735" y="440" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 无while循环重试
  </text>
  <text x="735" y="462" font-family="Arial, sans-serif" font-size="11" fill="#135200">
    • 操作简单，五步完成
  </text>
  
  <!-- 关键注意框 -->
  <rect x="720" y="500" width="250" height="120" rx="8" fill="#fff2f0" stroke="#ffccc7" stroke-width="1"/>
  <text x="735" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cf1322">
    关键顺序
  </text>
  <text x="735" y="550" font-family="Arial, sans-serif" font-size="11" fill="#cf1322">
    必须先读取next，再移动head
  </text>
  <text x="735" y="575" font-family="Arial, sans-serif" font-size="11" fill="#cf1322">
    否则丢失链表后续节点！
  </text>
  <text x="735" y="600" font-family="Arial, sans-serif" font-size="11" fill="#cf1322">
    多线程需CAS保证原子性
  </text>
</svg>