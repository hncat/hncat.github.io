<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5f1e3a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5f1e3a;stop-opacity:0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L2,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L2,6 Z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#0d1117"/>

  <!-- 标题 -->
  <text x="450" y="40" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="24" font-weight="600" fill="#e6edf3">内存栅栏 (Memory Fence) 执行图</text>
  <text x="450" y="70" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#8b949e">atomic_thread_fence 如何建立跨变量同步</text>

  <!-- 两栏背景 -->
  <rect x="50" y="100" width="380" height="480" rx="4" fill="url(#col1Grad)" stroke="#30363d" stroke-width="1"/>
  <rect x="470" y="100" width="380" height="480" rx="4" fill="url(#col2Grad)" stroke="#30363d" stroke-width="1"/>

  <!-- 栏目标题 -->
  <text x="240" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="16" font-weight="600" fill="#58a6ff">线程 A (write_x_then_y)</text>

  <text x="660" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="16" font-weight="600" fill="#f778ba">线程 B (read_y_then_x)</text>

  <!-- 线程 A 操作 -->
  <!-- x.store(relaxed) -->
  <rect x="90" y="160" width="300" height="60" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="240" y="185" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#e6edf3">① x.store(true, relaxed)</text>
  <text x="240" y="205" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">memory_order_relaxed</text>

  <!-- release fence - 高亮 -->
  <rect x="90" y="240" width="300" height="70" rx="6" fill="#21262d" stroke="#f0883e" stroke-width="3" filter="url(#glow)"/>
  <text x="240" y="270" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#f0883e" font-weight="bold">② atomic_thread_fence</text>
  <text x="240" y="295" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#f0883e" font-weight="600">memory_order_release</text>

  <!-- y.store(relaxed) -->
  <rect x="90" y="340" width="300" height="60" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="240" y="365" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#e6edf3">③ y.store(true, relaxed)</text>
  <text x="240" y="385" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">memory_order_relaxed</text>

  <!-- 线程 B 操作 -->
  <!-- y.load(relaxed) -->
  <rect x="510" y="340" width="300" height="60" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="660" y="365" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#e6edf3">④ y.load(relaxed)</text>
  <text x="660" y="385" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#8b949e">while (!y) 循环读取</text>

  <!-- acquire fence - 高亮 -->
  <rect x="510" y="420" width="300" height="70" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="3" filter="url(#glow)"/>
  <text x="660" y="450" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#58a6ff" font-weight="bold">⑤ atomic_thread_fence</text>
  <text x="660" y="475" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#58a6ff" font-weight="600">memory_order_acquire</text>

  <!-- x.load(relaxed) -->
  <rect x="510" y="520" width="300" height="60" rx="6" fill="#238636" stroke="#3fb950" stroke-width="2" opacity="0.2"/>
  <text x="660" y="545" text-anchor="middle" font-family="'Consolas', monospace" 
        font-size="12" fill="#3fb950">⑥ x.load(relaxed)</text>
  <text x="660" y="565" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#7ee787">✓ 保证读到 true，z++</text>

  <!-- 内部箭头 -->
  <path d="M240 220 L240 240" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M240 310 L240 340" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M660 400 L660 420" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M660 490 L660 520" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- 关键同步箭头：y.store -> y.load (建立栅栏同步的基础) -->
  <path d="M390 370 L510 370" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowHeadRed)"/>
  <text x="450" y="360" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#ff6b6b">读取③写入的值</text>

  <!-- 关键同步箭头：release fence -> acquire fence -->
  <path d="M390 275 Q450 275 510 455" stroke="#00d4ff" stroke-width="4" fill="none" marker-end="url(#arrowHead)"/>
  <text x="450" y="350" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#00d4ff" font-weight="600">栅栏同步 (synchronizes-with)</text>

  <!-- happens-before 箭头：x.store -> x.load -->
  <path d="M240 190 Q400 150 660 545" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowHead)"/>
  <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="10" fill="#00d4ff">happens-before (跨变量)</text>

  <!-- 底部解释 -->
  <rect x="50" y="600" width="400" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="625" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#f0883e" font-weight="600">栅栏同步机制</text>
  <text x="60" y="650" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    release fence ② 与 acquire fence ⑤ 同步
  </text>
  <text x="60" y="670" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    条件：④ 看到 ③ 写入的值（y.load 读到 true）
  </text>
  <text x="60" y="685" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    结果：① happens-before ⑥，断言不会触发
  </text>

  <rect x="470" y="600" width="380" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="625" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="13" fill="#58a6ff" font-weight="600">关键点</text>
  <text x="480" y="650" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 没有栅栏时：① 和 ⑥ 是无序的，断言可能失败
  </text>
  <text x="480" y="670" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 两个栅栏都是必要的：release + acquire 配对
  </text>
  <text x="480" y="685" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" 
        font-size="11" fill="#8b949e">
    • 栅栏建立了跨变量的 happens-before 关系
  </text>

</svg>